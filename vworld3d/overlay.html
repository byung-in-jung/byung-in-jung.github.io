<div id="vmap"></div>
<!-- 새롬동·모든 동 뷰어(flowmap/vwo_shared.js)의 '브이월드로 덮어 보기' 가 같은 출처(127.0.0.1) iframe 으로 연다. 키는 서버가 요청 때 .env 에서 읽어 config.js 에만 써 준다(저장·출력 안 함).
     부모와는 postMessage 만 주고받고, 메시지에 키·주소를 싣지 않는다. docs/VWORLD-OVERLAY.md -->
<script>window.VW3D_CONFIG={ok:true,version:'3.0',domain:'byung-in-jung.github.io'};document.write('<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=45F3FC63-6C5A-4635-BF1A-6E2EB95B2A99&domain=byung-in-jung.github.io"><\/script>');</script>
<script>
'use strict';
const P = window.parent, say = (m) => { try { P.postMessage(Object.assign({ vwo: 1 }, m), location.origin); } catch (e) {} };
let V = null, lockLook = false, wc = false, want = null, touched = false, doneSent = false, t0 = performance.now();
const D2R = Math.PI / 180;

function err(code) { say({ t: 'error', code }); }
// (엔진 자신의 스크립트가 내는 무해한 오류로 실패 처리하지 않는다: 엔진이 안 뜨면 아래 50초 타임아웃이 알린다)
if (!window.VW3D_CONFIG || !window.VW3D_CONFIG.ok) err('nokey');

else {
  try {
    let ip = [127.2508, 36.4800, 330, 0, -35]; const hm = /^#c=(-?[0-9.]+),(-?[0-9.]+),(-?[0-9.]+),(-?[0-9.]+),(-?[0-9.]+)$/.exec(location.hash); if (hm) ip = hm.slice(1).map(Number);      // 부모가 알려 준 시작 카메라(엔진이 시작하며 기본 위치로 되돌리는 것을 줄인다)
    const c0 = new vw.CoordZ(ip[0], ip[1], ip[2]);
    const opts = { mapId: 'vmap', initPosition: new vw.CameraPosition(c0, new vw.Direction(ip[3], ip[4], 0)), logo: true, navigation: true };
    window.map = new vw.Map(); map.setOption(opts); map.setMapId('vmap'); map.setInitPosition(opts.initPosition); map.setLogoVisible(true); map.start();
  } catch (e) { err('engine'); }
  const iv = setInterval(() => {
    if (map._wsViewer && map._wsViewer.scene) { clearInterval(iv); V = map._wsViewer; ready(); }
    else if (performance.now() - t0 > 50000) { clearInterval(iv); err('timeout'); }
  }, 200);
}

function ground(lon, lat) { try { const h = V.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(lon, lat)); return h == null || !isFinite(h) ? null : h; } catch (e) { return null; } }

function worldAt(px, py) {
  const w = new Cesium.Cartesian2(px, py); let c = null;
  try { if (V.scene.pickPositionSupported) c = V.scene.pickPosition(w); } catch (e) { c = null; }
  if (!c) { try { c = V.scene.globe.pick(V.camera.getPickRay(w), V.scene); } catch (e) { c = null; } }

}
// 누른 곳을 지나는 시선(카메라 위치 + 방향, 동·북·위)을 부모에 준다: 부모가 우리 건물과 만나는 벽을 찾는다(깊이 버퍼가 불안정해서 pickPosition 에 의존하지 않는다)
function rayAt(px, py) {
  try {
    const r = V.camera.getPickRay(new Cesium.Cartesian2(px, py)), g = Cesium.Cartographic.fromCartesian(r.origin), lon = Cesium.Math.toDegrees(g.longitude), lat = Cesium.Math.toDegrees(g.latitude), gd = ground(lon, lat);
    const inv = Cesium.Matrix4.inverseTransformation(Cesium.Transforms.eastNorthUpToFixedFrame(r.origin), new Cesium.Matrix4()), e = Cesium.Matrix4.multiplyByPointAsVector(inv, r.direction, new Cesium.Cartesian3());
    return { lon, lat, h: g.height, agl: gd == null ? null : g.height - gd, d: [e.x, e.y, e.z], pk: pickAt(px, py) };
  } catch (e) { return null; }
}
function pickAt(px, py) {
  try {
    const c = worldAt(px, py); if (!c) return null;
    const g = Cesium.Cartographic.fromCartesian(c), lon = Cesium.Math.toDegrees(g.longitude), lat = Cesium.Math.toDegrees(g.latitude), gd = ground(lon, lat);
    let n = null; const a = worldAt(px + 5, py), b = worldAt(px, py + 5);
    if (a && b) {

      if (Cesium.Cartesian3.magnitude(cr) > 1e-6) {
        Cesium.Cartesian3.normalize(cr, cr);
        const inv = Cesium.Matrix4.inverseTransformation(Cesium.Transforms.eastNorthUpToFixedFrame(c), new Cesium.Matrix4()), e = Cesium.Matrix4.multiplyByPointAsVector(inv, cr, new Cesium.Cartesian3());

    }
    return { lon, lat, h: g.height, agl: gd == null ? null : g.height - gd, n };
  } catch (e) { return null; }
}

// 부모가 준 카메라 {lon,lat,agl,absZ,heading,pitch,fov(수평/수직 중 큰 쪽이 아니라 세로 fov, 도),aspect}
// 개요(높은 고도) 뷰어는 추가로 ref={lon,lat,gAbs,e,n,u} (바라보는 지면점과 그 점 기준 카메라의 동·북·위 상대 위치)를 준다: 보는 땅의 높이를 기준으로
// 상대 위치·시선을 그 점의 동-북-위 좌표계에 그대로 놓는다(지구 곡률 포함, 먼 카메라 아래 지형 차이에 영향받지 않음). ref 가 없으면(동 뷰어) 예전 그대로.
const enuAt = (lon, lat, h) => Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(lon, lat, h));
function apply(c) {
  want = c;
  try { V.camera.cancelFlight && V.camera.cancelFlight(); } catch (e) { /* 비행 없음 */ }
  // Cesium 의 fov 는 가로가 더 길면 가로 화각, 아니면 세로 화각이다
  const v = c.fov * D2R, asp = c.aspect || (innerWidth / innerHeight), hf = 2 * Math.atan(Math.tan(v / 2) * asp);
  V.camera.frustum.fov = asp >= 1 ? hf : v;
  if (c.ref) {
    const r = c.ref, g = ground(r.lon, r.lat), T = g == null ? r.gAbs : g; want.gUsed = g; want.T = T;
    const M = enuAt(r.lon, r.lat, T), hd = c.heading * D2R, pt = c.pitch * D2R, ch = Math.cos(pt), sh = Math.sin(hd), chd = Math.cos(hd);
    const pos = Cesium.Matrix4.multiplyByPoint(M, new Cesium.Cartesian3(r.e, r.n, r.u), new Cesium.Cartesian3());
    const dir = Cesium.Matrix4.multiplyByPointAsVector(M, new Cesium.Cartesian3(sh * ch, chd * ch, Math.sin(pt)), new Cesium.Cartesian3());
    const up = Cesium.Matrix4.multiplyByPointAsVector(M, new Cesium.Cartesian3(-sh * Math.sin(pt), -chd * Math.sin(pt), ch), new Cesium.Cartesian3());
    V.camera.setView({ destination: pos, orientation: { direction: dir, up } });
    const cg = Cesium.Cartographic.fromCartesian(pos); want.cLon = Cesium.Math.toDegrees(cg.longitude); want.cLat = Cesium.Math.toDegrees(cg.latitude); want.hUsed = cg.height;
    want.eh = Cesium.Math.toDegrees(V.camera.heading); want.ep = Cesium.Math.toDegrees(V.camera.pitch);      // 곡률 때문에 카메라 자신의 동-북-위 기준 방향은 ref 기준과 0.1도 안팎 달라서 실제 엔진 값으로 비교한다
  } else {
    const g = ground(c.lon, c.lat); want.gUsed = g;
    const h = g == null ? c.absZ : g + c.agl; want.hUsed = h;
    V.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, h), orientation: { heading: c.heading * D2R, pitch: c.pitch * D2R, roll: 0 } });
  }

const refGround = (w) => (w.ref ? ground(w.ref.lon, w.ref.lat) : ground(w.lon, w.lat));

function ready() {
  // 사용자가 이 화면을 직접 움직이면 지형이 늦게 와도 카메라를 다시 맞추지 않는다
  let dn = null;
  const cv = V.scene.canvas; ['wheel', 'keydown'].forEach((e) => cv.addEventListener(e, () => { touched = true; }, { passive: true }));
  cv.addEventListener('pointermove', (e) => { if (e.buttons && dn && Math.hypot(e.clientX - dn.x, e.clientY - dn.y) > 6) touched = true; }, { passive: true });      // 짧은 클릭(창가 클릭)은 카메라를 만진 것으로 치지 않는다
  // 창가 클릭: 짧게 눌렀을 때(드래그 아님) 그 점의 3D 위치·면 방향을 부모에 알린다(부모가 우리 건물 벽에 맞춘다)
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') say({ t: 'esc' }); });      // 키보드 초점이 이 창에 있어도 Esc 를 부모에 전달
  cv.addEventListener('pointerdown', (e) => { dn = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX, ly: e.clientY, id: e.pointerId }; }, { passive: true });
  // 창가 시점(잠금): 끌기는 엔진 카메라가 아니라 부모의 창가 시선을 돌린다(부모가 돌린 값을 다시 'cam' 으로 보내 준다)
  cv.addEventListener('pointermove', (e) => { if (lockLook && dn && e.buttons && e.pointerId === dn.id) { say({ t: 'look', dx: e.clientX - dn.lx, dy: e.clientY - dn.ly }); dn.lx = e.clientX; dn.ly = e.clientY; } }, { passive: true });
  cv.addEventListener('pointerup', (e) => {
    if (!wc || !dn) return; const mv = Math.hypot(e.clientX - dn.x, e.clientY - dn.y), dt = performance.now() - dn.t; dn = null;
    if (mv > 6 || dt > 700) return; say({ t: 'pick', pick: rayAt(e.clientX, e.clientY) });
  }, { passive: true });
  cv.addEventListener('wheel', (e) => { if (lockLook) { e.preventDefault(); say({ t: 'wheel', dy: e.deltaY }); } }, { passive: false });      // 창가 시점(잠금): 휠은 화각만 바꾼다(부모가 처리)
  // 지형 높이가 처음엔 비어 있어 AGL 이 틀어질 수 있다: 지형 타일이 오면 한 번씩 다시 맞춘다(건드리기 전까지)
  let seenQ = false;
  V.scene.globe.tileLoadProgressEvent.addEventListener((n) => { if (n > 0) seenQ = true; if (n === 0 && want && !touched) { const g = refGround(want); if (g != null && (want.gUsed == null || Math.abs(g - want.gUsed) > 0.5)) apply(want); } });
  // 브이월드 화면(또는 엔진 조작 버튼)을 사용자가 직접 만졌는지: 만지기 전까지만 우리 시점을 지킨다
  window.addEventListener('pointerdown', (e) => { if (e.target !== cv) touched = true; }, true);
  // ---- 영상이 실제로 도착했는지 화면 픽셀로 확인: 아래쪽 55% 를 작게 줄여 밝기 표준편차를 잰다(지면 단색 = 영상 없음). 렌더 직후(postRender)에만 캔버스를 읽을 수 있다.
  const sc = document.createElement('canvas'); sc.width = 48; sc.height = 24; const sx = sc.getContext('2d', { willReadFrequently: true });
  let wantSample = false, std = 0, mean = 0, realN = 0, realT = 0, okN = 0;
  const imgPending = () => { try { const tr = V.scene.globe._surface._tilesToRender; let n = 0; for (const t of tr) { const im = t.data && t.data.imagery; if (im) for (const ti of im) { const li = ti.loadingImagery; if (li && li.state < 4) n++; }      /* 4=READY, 5/6=FAILED·INVALID 는 엔진이 상위 타일 영상으로 대신하므로 기다리지 않는다 */ } return tr.length ? n : 1; } catch (e) { return -1; } };
  V.scene.postRender.addEventListener(() => {
    if (!wantSample) return; wantSample = false;
    try {
      const w = cv.width, h = cv.height; if (!w || !h) return;
      sx.drawImage(cv, 0, Math.floor(h * 0.45), w, Math.ceil(h * 0.55), 0, 0, 48, 24);
      const d = sx.getImageData(0, 0, 48, 24).data; let s1 = 0, s2 = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; s1 += y; s2 += y * y; n++; }
      mean = s1 / n; std = Math.sqrt(Math.max(0, s2 / n - mean * mean));
    } catch (e) { std = -1; }
  });
  const dist = () => {      // 지금 엔진 카메라가 우리가 바라는 값에서 얼마나 벗어났나
    if (!want) return 0; const c = V.camera.positionCartographic, lon = Cesium.Math.toDegrees(c.longitude), lat = Cesium.Math.toDegrees(c.latitude);
    const wl = want.cLon != null ? want.cLon : want.lon, wt = want.cLat != null ? want.cLat : want.lat, dx = (lon - wl) * 111320 * Math.cos(wt * D2R), dy = (lat - wt) * 110574, dz = want.hUsed == null ? 0 : c.height - want.hUsed;
    const wh = want.eh != null ? want.eh : want.heading, wp = want.ep != null ? want.ep : want.pitch; let dh = Math.abs(Cesium.Math.toDegrees(V.camera.heading) - wh) % 360; if (dh > 180) dh = 360 - dh;
    return Math.max(Math.hypot(dx, dy) / 2, Math.abs(dz) / 4, dh / 0.7, Math.abs(Cesium.Math.toDegrees(V.camera.pitch) - wp) / 0.7);      // 1 이상이면 벗어남
  };
  say({ t: 'ready' });
  // 창이 가려지거나 다른 탭 뒤에 있으면 브라우저가 requestAnimationFrame 을 멈춰 엔진이 그리지 못하고 타일도 못 받아 로딩이 끝없이 길어졌다(R6): 로딩이 끝나기 전에는 프레임이 안 나오면 직접 그려 준다.
  let lf = -1, lt = 0;

  let lastSend = 0;
  setInterval(() => {
    if (want && !touched && dist() > 1) apply(want);      // 엔진이 로딩 중·뒤에 카메라를 기본 위치로 되돌리거나 지형 높이가 늦게 와도, 사용자가 만지기 전까지는 우리 시점을 유지한다(벗어난 것이 보일 때만 다시 건다: 매초 setView 하지 않는다)
    if (doneSent) return;
    wantSample = true; V.scene.requestRender && V.scene.requestRender();
    const pend = imgPending();      // 아직 안 온 지면 영상 조각 수(-1 = 알 수 없음)
    const ok = seenQ && V.scene.globe.tilesLoaded && pend <= 0 && (() => { const pr = V.scene.primitives; for (let i = 0; i < pr.length; i++) { const p = pr.get(i); if (p && p.tilesLoaded === false) return false; } return true; })();      // 타일 요청이 실제로 있었고 모두 도착
    okN = ok ? okN + 1 : 0;
    const sec = (performance.now() - t0) / 1000, real = std >= 8 && want && (touched || dist() <= 1.5);      // 화면이 단색이 아니고 카메라가 맞아 있을 때(건물 모델만 먼저 와도 통과하므로 위 ok 가 영상 도착을 보증)
    if (real) { realN++; if (!realT) realT = performance.now(); } else { realN = 0; realT = 0; }
    const since = realT ? (performance.now() - realT) / 1000 : 0, low = want && want.agl < 200, settle = (low ? 8 : (want && want.hi ? 4 : 3));      // 낮은 시점은 건물 타일이 더 늦게 와서 더 기다린다. 개요(고도 1.5 km 이상, 넓은 장면)는 조각이 많아 한 번 더 여유
    say({ t: 'progress', sec: Math.round(sec), has: !!want, std: Math.round(std * 10) / 10, real: realN, tl: !!ok, q: seenQ, pend, d: Math.round(dist() * 100) / 100 });

  }, 1000);
  ready.reset = () => { doneSent = false; realN = 0; realT = 0; okN = 0; resent = true; };
}
let resent = false;

// 현재 카메라 -> 부모 (끌 때 쓰는 값)
function snapshot() {
  const c = V.camera.positionCartographic, lon = Cesium.Math.toDegrees(c.longitude), lat = Cesium.Math.toDegrees(c.latitude), g = ground(lon, lat);
  return { lon, lat, h: c.height, g, agl: g == null ? null : c.height - g, heading: Cesium.Math.toDegrees(V.camera.heading), pitch: Cesium.Math.toDegrees(V.camera.pitch), touched };
}
function snapshotRef() {      // 개요: 보낸 때와 같은 지면점 좌표계에서 본 현재 카메라(위치 e,n,u 와 시선 방향) -> 부모가 같은 식으로 되돌린다
  const sn = snapshot(); if (!want || !want.ref) return sn;
  const r = want.ref, inv = Cesium.Matrix4.inverseTransformation(enuAt(r.lon, r.lat, want.T), new Cesium.Matrix4());
  const p = Cesium.Matrix4.multiplyByPoint(inv, V.camera.positionWC, new Cesium.Cartesian3()), d = Cesium.Matrix4.multiplyByPointAsVector(inv, V.camera.directionWC, new Cesium.Cartesian3());
  sn.rel = [p.x, p.y, p.z]; sn.dir = [d.x, d.y, d.z]; sn.ref = { lon: r.lon, lat: r.lat }; return sn;
}

// ---- 그림자 덮기(docs/VWORLD-OVERLAY.md '그림자 덮기'): 부모(우리 일조 엔진)가 계산한 그림자 링(위경도)을 투명 캔버스 하나에 합쳐 그려 브이월드 지면 위에 덮는다.
// 방식 'prim'(기본) = 지면 클램프 사각형(GroundPrimitive) + 캔버스 재질(캔버스 두 장을 번갈아 갈아 끼움, 레이어 교체 깜박임 없음), 'img' = 단일 타일 영상 레이어(예비).
// 엔진 시계(viewer.clock)도 같은 시각으로 맞춘다(태양 방향 일치). 엔진 자체 그림자(viewer.shadows)는 부모가 요청할 때만 켠다.
const SHD = { mode: 'prim', alpha: 0.6, layer: null, prim: null, mat: null, cvs: [document.createElement('canvas'), document.createElement('canvas')], ci: 0, tcv: document.createElement('canvas'), pending: null, busy: false, rect: null, n: 0, shown: false, eng: false };
function frames(n, ms) { return new Promise((res) => { let k = n, done = false; const fin = () => { if (done) return; done = true; try { rm(); } catch (e) { /* 이미 해제 */ } res(); }; const rm = V.scene.postRender.addEventListener(() => { if (--k <= 0) fin(); }); try { V.scene.requestRender && V.scene.requestRender(); } catch (e) { /* 무시 */ } setTimeout(fin, ms || 700); }); }
function engSun(center) {      // 브이월드 엔진이 쓰는 태양 방향(ENU 고도·방위, 도). 한 프레임 그린 뒤 uniformState 에서 읽는다
